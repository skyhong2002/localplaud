<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>localplaud</title>
<meta name="robots" content="noindex">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#EAF3FF,#F1ECFF);
       font:16px/1.5 -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:#101828}
  .card{text-align:center;padding:32px}
  .spin{width:28px;height:28px;border:3px solid #C7D7FE;border-top-color:#007AFF;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .err{display:none;color:#B42318;max-width:420px}
</style>
</head>
<body>
<div class="card">
  <div class="spin" aria-hidden="true"></div>
  <p id="msg">Loading the localplaud demo…</p>
  <p class="err" id="err">This demo needs a browser with Service Worker support (not private browsing in some browsers).
    You can still <a href="https://github.com/skyhong2002/localplaud">see screenshots on GitHub</a>.</p>
</div>
<script>
(function () {
  var BASE = "/localplaud/demo";
  if (location.pathname.indexOf(BASE) !== 0) { location.replace("/localplaud/"); return; }
  function fail() { document.getElementById("err").style.display = "block"; document.querySelector(".spin").style.display = "none"; }
  if (!("serviceWorker" in navigator)) return fail();
  var target = location.pathname.indexOf(BASE) === 0 ? location.pathname + location.search + location.hash : BASE + "/";
  if (target === BASE + "/index.html") target = BASE + "/";
  if (navigator.serviceWorker.controller) {
    // Controlled but the worker did not answer (e.g. stale cache): retry once.
    if (!sessionStorage.getItem("lp-demo-retry")) { sessionStorage.setItem("lp-demo-retry", "1"); location.replace(target); }
    return;
  }
  navigator.serviceWorker.register(BASE + "/sw.js", { scope: BASE + "/" }).then(function () {
    return navigator.serviceWorker.ready;
  }).then(function () {
    function go() { sessionStorage.removeItem("lp-demo-retry"); location.replace(target); }
    if (navigator.serviceWorker.controller) go();
    else navigator.serviceWorker.addEventListener("controllerchange", go);
  }).catch(fail);
})();
</script>
</body>
</html>
