<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{% block title %}帳號{% endblock %} · localplaud</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <script>try{const m=localStorage.getItem('localplaud:appearance')||'system';document.documentElement.dataset.appearance=m==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):m;}catch(e){}</script>
  <link rel="stylesheet" href="/static/css/app.css?v={{ asset_version }}">
  <link rel="stylesheet" href="/static/css/accounts.css?v={{ asset_version }}">
  <script src="/static/js/accounts.js?v={{ asset_version }}" defer></script>
</head>
<body class="auth-shell">
  <a class="skip-link" href="#content">跳至主要內容</a>
  <header class="account-header">
    <a class="brand" href="{{ '/home' if account_user is defined and account_user.status == 'active' else '/login' }}"><img src="/static/logo.svg" alt=""><span>local<b>plaud</b></span></a>
    {% if account_user is defined and account_user %}
    <nav aria-label="帳號導覽">
      {% if account_user.status == 'active' %}<a href="/home">工作區</a>{% endif %}
      <a href="/account" {% if request.url.path == '/account' %}aria-current="page"{% endif %}>我的帳號</a>
      {% if account_user.role == 'owner' and account_user.status == 'active' %}<a href="/admin/users" {% if request.url.path == '/admin/users' %}aria-current="page"{% endif %}>帳號管理</a>{% endif %}
      <form action="/logout" method="post"><button class="link-button" type="submit">登出</button></form>
    </nav>
    {% endif %}
  </header>
  <main id="content" class="{% block main_class %}auth-main{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <footer class="account-footer">你的錄音，你的工作區。<span>localplaud</span></footer>
</body>
</html>
